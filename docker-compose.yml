services:
  wordpress:
    image: wordpress:latest
    container_name: wp-practice-wordpress
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      WP_ENVIRONMENT_TYPE: local
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: ${WP_DB_USER:-wp_user}
      WORDPRESS_DB_PASSWORD: ${WP_DB_PASSWORD:-wp_password}
      WORDPRESS_DB_NAME: ${WP_DB_NAME:-wp_practice}
    volumes:
      - wordpress_data:/var/www/html
      - ./uploads.ini:/usr/local/etc/php/conf.d/uploads.ini
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: wp-practice-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${WP_DB_NAME:-wp_practice}
      MYSQL_USER: ${WP_DB_USER:-wp_user}
      MYSQL_PASSWORD: ${WP_DB_PASSWORD:-wp_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
    volumes:
      - db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: wp-practice-phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
    depends_on:
      - db

  phpmyadmin-new:
    image: phpmyadmin:latest
    container_name: wp-practice-phpmyadmin-new
    restart: unless-stopped
    ports:
      - "8082:80"
    environment:
      PMA_HOST: db-new
      PMA_USER: root
      PMA_PASSWORD: ${MYSQL_NEW_ROOT_PASSWORD:-root_password_new}
    depends_on:
      - db-new

  dns-sim:
    image: nginx:alpine
    container_name: wp-practice-dns-sim
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - wordpress
      - wordpress-new

  mailpit:
    image: axllent/mailpit:latest
    container_name: wp-practice-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"

  wordpress-new:
    image: wordpress:latest
    container_name: wp-practice-wordpress-new
    restart: unless-stopped
    ports:
      - "8090:80"
    environment:
      WP_ENVIRONMENT_TYPE: local
      WORDPRESS_DB_HOST: db-new:3306
      WORDPRESS_DB_USER: ${WP_NEW_DB_USER:-wp_user_new}
      WORDPRESS_DB_PASSWORD: ${WP_NEW_DB_PASSWORD:-wp_password_new}
      WORDPRESS_DB_NAME: ${WP_NEW_DB_NAME:-wp_practice_new}
    volumes:
      - wordpress_new_data:/var/www/html
      - ./uploads.ini:/usr/local/etc/php/conf.d/uploads.ini
      - ./greenline-site-style:/var/www/html/wp-content/plugins/greenline-site-style
    depends_on:
      - db-new

  db-new:
    image: mysql:8.0
    container_name: wp-practice-db-new
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${WP_NEW_DB_NAME:-wp_practice_new}
      MYSQL_USER: ${WP_NEW_DB_USER:-wp_user_new}
      MYSQL_PASSWORD: ${WP_NEW_DB_PASSWORD:-wp_password_new}
      MYSQL_ROOT_PASSWORD: ${MYSQL_NEW_ROOT_PASSWORD:-root_password_new}
    volumes:
      - db_new_data:/var/lib/mysql

volumes:
  wordpress_data:
  db_data:
  wordpress_new_data:
  db_new_data:
